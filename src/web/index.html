<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Get your game files</title>
<style>
  :root {
    --background: #101012;
    --surface: #17171a;
    --raised: #1f1f23;
    --border: #ffffff14;
    --text: #f2f2f4;
    --muted: #9a9aa2;
    --accent: #4cc2ff;
    --success: #6ccb5f;
    --error: #ff99a4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 720px;
    padding: 24px 20px 48px;
    background: var(--background);
    color: var(--text);
    font-family: Roboto, system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 24px; }
  .brand { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 28px; font-weight: 500; margin: 6px 0 0; }
  p { margin: 0 0 16px; }
  .lead { color: var(--muted); }
  .drop {
    border: 1px dashed var(--border);
    border-radius: 0;
    background: var(--surface);
    padding: 28px 20px;
    text-align: center;
    color: var(--muted);
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  label.button {
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--text);
    padding: 10px 18px;
    cursor: pointer;
  }
  label.button:active { border-color: var(--accent); }
  input[type=file] { display: none; }
  h2 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .bar { height: 10px; background: var(--raised); overflow: hidden; margin-bottom: 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .summary { font-size: 18px; font-variant-numeric: tabular-nums; }
  .small { color: var(--muted); font-size: 13px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    border-top: 1px solid var(--border);
    font-size: 13px;
    padding: 8px 0;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  li:last-child { border-bottom: 1px solid var(--border); }
  li.bad { color: var(--error); }
  li.ok { color: var(--success); }
  #serverError:empty { display: none; }
  #serverError { color: var(--error); }
</style>
</head>
<body>
<header>
  <div class="brand">1 vs 100 setup</div>
  <h1>Get your game files</h1>
</header>

<p class="lead">Send the files to the console from this browser, or use the console's own file pickers. Every file is checked before the game starts.</p>

<div class="drop" id="drop">
  Drop files or a folder here
  <div class="buttons">
    <label class="button">Choose files<input type="file" id="files" multiple></label>
    <label class="button">Choose folder<input type="file" id="folder" webkitdirectory multiple></label>
  </div>
</div>

<h2>Progress</h2>
<div class="summary" id="summary">Loading...</div>
<div class="small" id="currentLabel">Current file</div>
<div class="bar"><div id="current"></div></div>
<div class="small">Overall</div>
<div class="bar"><div id="overall"></div></div>
<div class="small" id="serverError"></div>

<h2>Still needed</h2>
<ul id="missing"></ul>

<h2>This session</h2>
<ul id="log"></ul>

<script>
"use strict";
let status = null;
let busy = false;
const inflight = new Map();  // manifest path -> bytes sent

// The console matches picked paths to manifest files, so the page follows
// whatever naming rules the host accepts.
async function matchPaths(paths) {
  const r = await fetch("/match", { method: "POST", body: paths.join("\n"), cache: "no-store" });
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function fmt(bytes) {
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(i ? 1 : 0) + " " + units[i];
}

function log(text, cls) {
  const li = document.createElement("li");
  li.textContent = text;
  if (cls) li.className = cls;
  document.getElementById("log").prepend(li);
}

function render() {
  if (!status) return;
  let sent = 0;
  for (const v of inflight.values()) sent += v;
  document.getElementById("summary").textContent =
    `${status.ready} of ${status.count} files ready, ${fmt(status.bytes_ready)} of ${fmt(status.bytes_total)}` +
    (status.checking ? " (the console is checking files)" : "");
  const overall = status.bytes_total ? (status.bytes_ready + sent) / status.bytes_total : 1;
  document.getElementById("overall").style.width = Math.min(100, overall * 100) + "%";
  document.getElementById("serverError").textContent = status.error || "";
  const list = document.getElementById("missing");
  list.innerHTML = "";
  for (const f of status.files) {
    if (f.state === "ok" || f.covered) continue;
    const li = document.createElement("li");
    li.textContent = `${f.path} (${fmt(f.size)}) - ${f.state}` + (f.alternative ? " (or the other avatar file)" : "");
    if (f.state === "bad-hash") li.className = "bad";
    list.appendChild(li);
  }
  if (!list.children.length) {
    const li = document.createElement("li");
    li.className = "ok";
    li.textContent = "Nothing. All files are on the console.";
    list.appendChild(li);
  }
}

async function refresh() {
  try {
    const r = await fetch("/status", { cache: "no-store" });
    status = await r.json();
    render();
  } catch (e) { /* console unreachable for a moment */ }
}

async function poll() {
  await refresh();
  setTimeout(poll, 700);
}

function upload(file, entry) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/upload/" + entry.path.split("/").map(encodeURIComponent).join("/"));
    xhr.upload.onprogress = e => {
      // With two uploads running, the bar follows whichever reported last.
      inflight.set(entry.path, e.loaded);
      document.getElementById("currentLabel").textContent = `Current file: ${entry.path}`;
      document.getElementById("current").style.width = (e.loaded / file.size * 100) + "%";
      render();
    };
    const done = async (ok, text) => {
      log(`${entry.path}: ${text}`, ok ? "ok" : "bad");
      // Refresh before dropping the in-flight bytes, so the overall bar and
      // the skip check never use a stale state.
      await refresh();
      inflight.delete(entry.path);
      render();
      resolve();
    };
    xhr.onload = () => {
      let text = xhr.statusText;
      try { text = JSON.parse(xhr.responseText).result; } catch (e) {}
      done(xhr.status === 200, xhr.status === 200 ? "uploaded and verified" : `rejected: ${text}`);
    };
    xhr.onerror = () => done(false, "connection lost, try again");
    xhr.send(file);
  });
}

async function handle(items) {
  if (busy) { log("Wait for the current uploads to finish.", "bad"); return; }
  if (!status) { log("Not connected to the console yet.", "bad"); return; }
  busy = true;
  await refresh();
  const queue = [];
  const seen = new Set();
  // A line break would split one path into two lines of the request.
  items = items.filter(({ path }) => !path.includes("\n"));
  let matches;
  try {
    matches = await matchPaths(items.map(({ path }) => path));
  } catch (e) {
    log(`Could not ask the console which files it needs: ${e.message}`, "bad");
    busy = false;
    return;
  }
  for (const [i, { file, path }] of items.entries()) {
    const entry = status.files.find(f => f.path === matches[i]);
    if (!entry) { log(`${path}: not a needed file, skipped`); continue; }
    if (entry.state === "ok" || entry.covered || seen.has(entry.path)) continue;
    if (file.size !== entry.size) {
      log(`${path}: size ${file.size} does not match ${entry.size}, skipped`, "bad");
      continue;
    }
    seen.add(entry.path);
    queue.push({ file, entry });
  }
  if (!queue.length) log("Nothing new to upload.");
  const worker = async () => {
    while (queue.length) {
      const job = queue.shift();
      await upload(job.file, job.entry);
    }
  };
  await Promise.all([worker(), worker()]);
  document.getElementById("current").style.width = "0";
  document.getElementById("currentLabel").textContent = "Current file";
  busy = false;
}

function fromInput(input) {
  const items = [...input.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name }));
  input.value = "";
  handle(items);
}

async function walk(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, path: prefix + entry.name });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) await walk(child, prefix + entry.name + "/", out);
    }
  }
}

document.getElementById("files").addEventListener("change", e => fromInput(e.target));
document.getElementById("folder").addEventListener("change", e => fromInput(e.target));
const drop = document.getElementById("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", async e => {
  e.preventDefault();
  drop.classList.remove("over");
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const items = [];
  if (entries.length) {
    try {
      for (const entry of entries) await walk(entry, "", items);
    } catch (err) {
      log(`Could not read the dropped files: ${err}`, "bad");
      return;
    }
  } else {
    for (const f of e.dataTransfer.files) items.push({ file: f, path: f.name });
  }
  handle(items);
});
poll();
</script>
</body>
</html>
